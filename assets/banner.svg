<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070913" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="neonOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Animations -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(1deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(10px) rotate(-1.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes beamMove {
        0% { transform: translateX(-200px); opacity: 0; }
        50% { opacity: 0.8; }
        100% { transform: translateX(1400px); opacity: 0; }
      }

      .floating-item-1 { animation: floatSlow 7s ease-in-out infinite; }
      .floating-item-2 { animation: floatReverse 8s ease-in-out infinite; }
      .pulse-circle { animation: pulseGlow 6s ease-in-out infinite; transform-origin: center; }
      .data-flow-line { stroke-dasharray: 8 12; animation: dashFlow 20s linear infinite; }
      .light-beam { animation: beamMove 5s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />

  <!-- Background Tech Grid Pattern -->
  <g opacity="0.12" stroke="#60a5fa" stroke-width="0.75">
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="150" y1="0" x2="150" y2="420" />
    <line x1="300" y1="0" x2="300" y2="420" />
    <line x1="450" y1="0" x2="450" y2="420" />
    <line x1="600" y1="0" x2="600" y2="420" />
    <line x1="750" y1="0" x2="750" y2="420" />
    <line x1="900" y1="0" x2="900" y2="420" />
    <line x1="1050" y1="0" x2="1050" y2="420" />
  </g>

  <!-- Dynamic Glowing Orbs in Background -->
  <circle cx="200" cy="90" r="130" fill="#3b82f6" filter="url(#glow)" class="pulse-circle" />
  <circle cx="1020" cy="330" r="140" fill="#8b5cf6" filter="url(#glow)" class="pulse-circle" />
  <circle cx="650" cy="390" r="110" fill="#ec4899" opacity="0.2" filter="url(#glow)" />

  <!-- Dynamic Animated Flow Streams in Background -->
  <path d="M 50 320 C 300 240, 500 380, 800 290 C 950 240, 1080 270, 1150 220" 
        fill="none" stroke="url(#neonCyan)" stroke-width="2.5" opacity="0.4" class="data-flow-line" />
  <path d="M 50 100 C 350 180, 600 50, 850 140 C 1000 200, 1100 130, 1180 150" 
        fill="none" stroke="url(#neonOrange)" stroke-width="1.8" opacity="0.3" class="data-flow-line" />

  <!-- Animated Flying Particles/Nodes -->
  <g class="floating-item-1" opacity="0.6">
    <circle cx="180" cy="280" r="4" fill="#38bdf8" />
    <circle cx="230" cy="320" r="3" fill="#818cf8" />
    <circle cx="980" cy="90" r="5" fill="#f472b6" />
    <circle cx="1060" cy="140" r="3.5" fill="#c084fc" />
  </g>
  <g class="floating-item-2" opacity="0.6">
    <circle cx="120" cy="180" r="3.5" fill="#34d399" />
    <circle cx="900" cy="320" r="4.5" fill="#fbbf24" />
    <circle cx="1020" cy="240" r="3" fill="#60a5fa" />
  </g>

  <!-- Dynamic Moving Shimmer Beam across banner -->
  <rect x="0" y="2" width="160" height="416" fill="url(#neonCyan)" opacity="0.15" class="light-beam" transform="skewX(-25)" />

  <!-- Dynamic Aesthetic Cards on Flanks (Lower Layer behind text, positioned carefully) -->
  <g class="floating-item-1" opacity="0.75">
    <rect x="55" y="45" width="220" height="68" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1.2" />
    <circle cx="85" cy="79" r="16" fill="#0284c7" opacity="0.4" />
    <text x="85" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#38bdf8" text-anchor="middle" font-weight="bold">AI</text>
    <text x="115" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Video Presenters</text>
    <text x="115" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Expressive Avatars</text>
  </g>

  <g class="floating-item-2" opacity="0.75">
    <rect x="925" y="45" width="220" height="68" rx="12" fill="url(#cardGrad)" stroke="rgba(168, 85, 247, 0.35)" stroke-width="1.2" />
    <circle cx="955" cy="79" r="16" fill="#7e22ce" opacity="0.4" />
    <text x="955" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#c084fc" text-anchor="middle">⚡</text>
    <text x="985" y="73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" fill="#f8fafc" font-weight="600">Text-to-Video DiT</text>
    <text x="985" y="91" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Wan2.1 • CogVideoX</text>
  </g>

  <!-- FOREGROUND HERO HEADER & TEXT (Guaranteed on Top & Clear) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(600, 78)">
      <rect x="-190" y="-18" width="380" height="36" rx="18" fill="rgba(15, 23, 42, 0.85)" stroke="url(#neonCyan)" stroke-width="1.5" filter="url(#slightGlow)" />
      <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" text-anchor="middle" letter-spacing="1.5">
        🚀 GENERATIVE AI VIDEO &amp; BRIEFING SUITE
      </text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="44" font-weight="900" text-anchor="middle" letter-spacing="-0.5" fill="#ffffff">
      Awesome Text-To-Video
    </text>
    
    <!-- Title Second Line / Accent Glow -->
    <text x="600" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="38" font-weight="800" text-anchor="middle" letter-spacing="-0.5" fill="url(#neonCyan)" filter="url(#slightGlow)">
      Automated Briefing Generation
    </text>

    <!-- Subtitle / Tagline -->
    <text x="600" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="16" font-weight="400" text-anchor="middle" fill="#cbd5e1" letter-spacing="0.2">
      Curated Landscape of Enterprise SaaS Leaders, Open-Weight Foundation Models &amp; Avatar Engines
    </text>

    <!-- Bottom Highlights / Feature Pills -->
    <g transform="translate(600, 340)">
      <!-- Pill 1 -->
      <g transform="translate(-320, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#93c5fd" font-weight="500" text-anchor="middle">
          🤖 AI Presenters &amp; Lipsync
        </text>
      </g>
      
      <!-- Pill 2 -->
      <g transform="translate(-105, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#c084fc" font-weight="500" text-anchor="middle">
          🎬 Diffusion Transformers
        </text>
      </g>

      <!-- Pill 3 -->
      <g transform="translate(105, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#f472b6" font-weight="500" text-anchor="middle">
          📰 Auto Doc/URL-to-MP4
        </text>
      </g>

      <!-- Pill 4 -->
      <g transform="translate(320, 0)">
        <rect x="-85" y="-15" width="170" height="30" rx="15" fill="rgba(255, 255, 255, 0.05)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1" />
        <text x="0" y="5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#34d399" font-weight="500" text-anchor="middle">
          ⚡ Programmatic Remotion
        </text>
      </g>
    </g>
  </g>

  <!-- Polished Outer Border -->
  <rect x="0.5" y="0.5" width="1199" height="419" rx="16" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1" />
</svg>
